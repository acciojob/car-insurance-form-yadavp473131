<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
	<form method="post">
        <label for="name">Name</label>
        <input type="text" id="name" required />
        <label for="email">Email</label>
        <input type="email" required id="email" />
        <label for="gender_m">Gender</label>
        <input type="radio" id="gender_m" name="gender" required />
        <label for="gender_f">Gender</label>
        <input type="radio" id="gender_f" name="gender" required/>
        <label for="cars">Car Brands</label>
        <select id="cars">
            <option name="cars" value="bmw">BMW</option>
            <option name="cars" value="mercedez">Mercedez</option>
            <option name="cars" value="audi">Audi</option>
        </select>
        <label for="carage">Car Age</label>
        <input type="number" id="carage" required />
        <label>Date of Purchase(dop)</label>
        <input type="date" id="dop"  required />
        <label for="password">Password</label>
        <input type="password" required id="password" placeholder="Password" />
        <button type="submit">Submit</button>
    </form>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
